<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Andrew Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script>
/* EDITMODE-BEGIN */var TWEAK_DEFAULTS = {
  "theme": "light",
  "density": "cozy",
  "accent": "terracotta"
};/*EDITMODE-END*/
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="manifest.js"></script>
<script type="text/babel" src="login.jsx"></script>
<script type="text/babel" src="loader.jsx"></script>
<script type="text/babel" src="markdown.jsx"></script>
<script type="text/babel" src="reader.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="graph.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel" data-presets="react">
  // Wait for all babel-transpiled modules, check auth, then load wiki and mount.
  let _root = null;
  const getRoot = () => _root || (_root = ReactDOM.createRoot(document.getElementById("root")));

  const mount = async () => {
    if (!window.AB_APP || !window.AB_VIEWS || !window.AB_READER || !window.AB_GRAPH || !window.AB_UTILS || !window.AB_LOADER || !window.AB_LOGIN) {
      return setTimeout(mount, 20);
    }

    // Check session before loading the wiki — saves a flash of the dashboard if not authed.
    let authed = false;
    try {
      const r = await fetch("/api/auth/me", { credentials: "same-origin" });
      authed = r.ok;
    } catch (e) {
      console.error("auth check failed:", e);
    }

    if (!authed) {
      getRoot().render(<window.AB_LOGIN.LoginGate onAuth={mount} />);
      return;
    }

    try {
      await window.AB_LOADER.loadAll();
    } catch (e) {
      console.error("wiki load failed:", e);
    }
    getRoot().render(<window.AB_APP.App />);
  };
  mount();
</script>
</body>
</html>
